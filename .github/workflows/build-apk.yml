name: Build Buds Route Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/example/budsroutetest
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BudsRouteTest"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.budsroutetest'
              compileSdk 35

              defaultConfig {
                  applicationId "com.example.budsroutetest"
                  minSdk 28
                  targetSdk 35
                  versionCode 1
                  versionName "0.1"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Buds Route Test">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/example/budsroutetest/MainActivity.java <<'EOF'
          package com.example.budsroutetest;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.media.AudioAttributes;
          import android.media.AudioDeviceInfo;
          import android.media.AudioFormat;
          import android.media.AudioManager;
          import android.media.AudioRecord;
          import android.media.AudioTrack;
          import android.media.MediaRecorder;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Process;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.util.Locale;
          import java.util.concurrent.atomic.AtomicBoolean;

          public class MainActivity extends Activity {

              private static final int REQ = 100;
              private static final int INPUT_RATE = 32000;
              private static final int OUTPUT_RATE = 48000;

              private AudioManager audioManager;
              private TextView status;
              private Button startButton;
              private Button stopButton;

              private AudioRecord recorder;
              private AudioTrack player;

              private Thread recordThread;
              private Thread playThread;

              private final AtomicBoolean running = new AtomicBoolean(false);

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  audioManager =
                          (AudioManager) getSystemService(Context.AUDIO_SERVICE);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(32, 40, 32, 40);

                  TextView title = new TextView(this);
                  title.setText("Buds Route Test");
                  title.setTextSize(25);

                  TextView info = new TextView(this);
                  info.setText(
                          "Тест Bluetooth-аудио.\n\n" +
                          "650 Гц должен звучать ТОЛЬКО слева.\n" +
                          "1000 Гц должен звучать ТОЛЬКО справа.\n\n" +
                          "Одновременно приложение держит микрофон активным."
                  );
                  info.setTextSize(17);

                  Button refresh = new Button(this);
                  refresh.setText("ОБНОВИТЬ АУДИОУСТРОЙСТВА");

                  startButton = new Button(this);
                  startButton.setText("START TEST");

                  stopButton = new Button(this);
                  stopButton.setText("STOP");
                  stopButton.setEnabled(false);

                  status = new TextView(this);
                  status.setTextSize(13);
                  status.setTextIsSelectable(true);

                  root.addView(title);
                  root.addView(info);
                  root.addView(refresh);
                  root.addView(startButton);
                  root.addView(stopButton);
                  root.addView(status);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(root);
                  setContentView(scroll);

                  refresh.setOnClickListener(v -> refreshDevices());

                  startButton.setOnClickListener(v -> {
                      if (hasPermissions()) {
                          startTest();
                      } else {
                          requestPermissionsNow();
                      }
                  });

                  stopButton.setOnClickListener(v -> stopTest());

                  refreshDevices();
              }

              private boolean hasPermissions() {
                  boolean mic =
                          checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                                  == PackageManager.PERMISSION_GRANTED;

                  boolean bluetooth = true;

                  if (Build.VERSION.SDK_INT >= 31) {
                      bluetooth =
                              checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT)
                                      == PackageManager.PERMISSION_GRANTED;
                  }

                  return mic && bluetooth;
              }

              private void requestPermissionsNow() {
                  if (Build.VERSION.SDK_INT >= 31) {
                      requestPermissions(
                              new String[]{
                                      Manifest.permission.RECORD_AUDIO,
                                      Manifest.permission.BLUETOOTH_CONNECT
                              },
                              REQ
                      );
                  } else {
                      requestPermissions(
                              new String[]{
                                      Manifest.permission.RECORD_AUDIO
                              },
                              REQ
                      );
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults
              ) {
                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults
                  );

                  if (requestCode == REQ && hasPermissions()) {
                      startTest();
                  }
              }

              private void refreshDevices() {
                  status.setText("");

                  append("=== INPUTS ===");

                  try {
                      for (AudioDeviceInfo d :
                              audioManager.getDevices(
                                      AudioManager.GET_DEVICES_INPUTS)) {

                          append(deviceLine(d));
                      }

                      append("");
                      append("=== OUTPUTS ===");

                      for (AudioDeviceInfo d :
                              audioManager.getDevices(
                                      AudioManager.GET_DEVICES_OUTPUTS)) {

                          append(deviceLine(d));
                      }

                  } catch (SecurityException e) {
                      append("Сначала разреши Bluetooth.");
                  }
              }

              private String deviceLine(AudioDeviceInfo d) {
                  return "id=" + d.getId()
                          + "  " + typeName(d.getType())
                          + "  " + d.getProductName();
              }

              private String typeName(int type) {
                  switch (type) {
                      case AudioDeviceInfo.TYPE_BLE_HEADSET:
                          return "BLE_HEADSET";

                      case AudioDeviceInfo.TYPE_BLE_SPEAKER:
                          return "BLE_SPEAKER";

                      case AudioDeviceInfo.TYPE_BLUETOOTH_A2DP:
                          return "BT_A2DP";

                      case AudioDeviceInfo.TYPE_BLUETOOTH_SCO:
                          return "BT_SCO";

                      case AudioDeviceInfo.TYPE_BUILTIN_MIC:
                          return "BUILTIN_MIC";

                      case AudioDeviceInfo.TYPE_BUILTIN_SPEAKER:
                          return "BUILTIN_SPEAKER";

                      default:
                          return "TYPE_" + type;
                  }
              }

              private AudioDeviceInfo chooseInput() {
                  AudioDeviceInfo[] inputs =
                          audioManager.getDevices(
                                  AudioManager.GET_DEVICES_INPUTS);

                  for (AudioDeviceInfo d : inputs) {
                      if (d.getType()
                              == AudioDeviceInfo.TYPE_BLE_HEADSET) {
                          return d;
                      }
                  }

                  for (AudioDeviceInfo d : inputs) {
                      if (d.getType()
                              == AudioDeviceInfo.TYPE_BLUETOOTH_SCO) {
                          return d;
                      }
                  }

                  return null;
              }

              private AudioDeviceInfo chooseOutput() {
                  AudioDeviceInfo[] outputs =
                          audioManager.getDevices(
                                  AudioManager.GET_DEVICES_OUTPUTS);

                  for (AudioDeviceInfo d : outputs) {
                      if (d.getType()
                              == AudioDeviceInfo.TYPE_BLE_HEADSET) {
                          return d;
                      }
                  }

                  for (AudioDeviceInfo d : outputs) {
                      if (d.getType()
                              == AudioDeviceInfo.TYPE_BLUETOOTH_A2DP) {
                          return d;
                      }
                  }

                  for (AudioDeviceInfo d : outputs) {
                      if (d.getType()
                              == AudioDeviceInfo.TYPE_BLUETOOTH_SCO) {
                          return d;
                      }
                  }

                  return null;
              }

              private void startTest() {
                  if (running.get()) return;

                  AudioDeviceInfo input = chooseInput();
                  AudioDeviceInfo output = chooseOutput();

                  append("");
                  append("=== START ===");

                  append(
                          "Requested input: "
                                  + (input == null
                                  ? "DEFAULT"
                                  : deviceLine(input))
                  );

                  append(
                          "Requested output: "
                                  + (output == null
                                  ? "DEFAULT"
                                  : deviceLine(output))
                  );

                  int inputBuffer =
                          AudioRecord.getMinBufferSize(
                                  INPUT_RATE,
                                  AudioFormat.CHANNEL_IN_MONO,
                                  AudioFormat.ENCODING_PCM_16BIT
                          );

                  recorder =
                          new AudioRecord.Builder()
                                  .setAudioSource(
                                          MediaRecorder.AudioSource.MIC)
                                  .setAudioFormat(
                                          new AudioFormat.Builder()
                                                  .setEncoding(
                                                          AudioFormat.ENCODING_PCM_16BIT)
                                                  .setSampleRate(INPUT_RATE)
                                                  .setChannelMask(
                                                          AudioFormat.CHANNEL_IN_MONO)
                                                  .build()
                                  )
                                  .setBufferSizeInBytes(
                                          Math.max(inputBuffer * 2, 8192))
                                  .build();

                  if (input != null) {
                      append(
                              "Mic preferred device: "
                                      + recorder.setPreferredDevice(input)
                      );
                  }

                  int outputBuffer =
                          AudioTrack.getMinBufferSize(
                                  OUTPUT_RATE,
                                  AudioFormat.CHANNEL_OUT_STEREO,
                                  AudioFormat.ENCODING_PCM_16BIT
                          );

                  player =
                          new AudioTrack.Builder()
                                  .setAudioAttributes(
                                          new AudioAttributes.Builder()
                                                  .setUsage(
                                                          AudioAttributes.USAGE_MEDIA)
                                                  .setContentType(
                                                          AudioAttributes.CONTENT_TYPE_SPEECH)
                                                  .build()
                                  )
                                  .setAudioFormat(
                                          new AudioFormat.Builder()
                                                  .setEncoding(
                                                          AudioFormat.ENCODING_PCM_16BIT)
                                                  .setSampleRate(OUTPUT_RATE)
                                                  .setChannelMask(
                                                          AudioFormat.CHANNEL_OUT_STEREO)
                                                  .build()
                                  )
                                  .setTransferMode(
                                          AudioTrack.MODE_STREAM)
                                  .setBufferSizeInBytes(
                                          Math.max(outputBuffer * 2, 16384))
                                  .build();

                  if (output != null) {
                      append(
                              "Output preferred device: "
                                      + player.setPreferredDevice(output)
                      );
                  }

                  running.set(true);

                  startButton.setEnabled(false);
                  stopButton.setEnabled(true);

                  recorder.startRecording();
                  player.play();

                  recordThread =
                          new Thread(() -> {

                              Process.setThreadPriority(
                                      Process.THREAD_PRIORITY_AUDIO);

                              short[] buffer =
                                      new short[1024];

                              int count = 0;

                              while (running.get()) {

                                  int n =
                                          recorder.read(
                                                  buffer,
                                                  0,
                                                  buffer.length,
                                                  AudioRecord.READ_BLOCKING
                                          );

                                  if (n > 
